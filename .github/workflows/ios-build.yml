name: iOS Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Xcode 16.4
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Validate shared scheme
        run: xcodebuild -project MemoryHub.xcodeproj -list

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project MemoryHub.xcodeproj \
            -scheme MemoryHub \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/MemoryHubDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build

      - name: Select and boot iPhone simulator
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_UDID="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          matches = []
          for runtime, entries in devices.items():
              version = tuple(int(part) for part in re.findall(r"iOS-(\d+)(?:-(\d+))?", runtime)[0]) if "iOS-" in runtime else ()
              for device in entries:
                  if device["name"] == "iPhone 16" and device.get("isAvailable", False):
                      matches.append((version, device["udid"]))
          if not matches:
              raise SystemExit("No available iPhone 16 simulator found")
          print(max(matches)[1])
          ')"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Install and launch Memory Hub
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/MemoryHubDerivedData/Build/Products/Debug-iphonesimulator/MemoryHub.app"
          test -d "$APP_PATH"
          echo "Installing $APP_PATH"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          echo "Launching com.glandy.memoryhub"
          xcrun simctl launch "$SIMULATOR_UDID" com.glandy.memoryhub \
            -AppleLanguages '(zh-Hans)' \
            -AppleLocale zh_CN \
            --memory-hub-screenshot-sample

      - name: Capture light and dark home screens
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/MemoryHubScreenshots"

          xcrun simctl ui "$SIMULATOR_UDID" appearance light
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.glandy.memoryhub \
            -AppleLanguages '(zh-Hans)' \
            -AppleLocale zh_CN \
            --memory-hub-screenshot-sample
          sleep 5
          xcrun simctl io "$SIMULATOR_UDID" screenshot \
            "$RUNNER_TEMP/MemoryHubScreenshots/home-light.png"

          xcrun simctl ui "$SIMULATOR_UDID" appearance dark
          xcrun simctl launch --terminate-running-process "$SIMULATOR_UDID" com.glandy.memoryhub \
            -AppleLanguages '(zh-Hans)' \
            -AppleLocale zh_CN \
            --memory-hub-screenshot-sample
          sleep 5
          xcrun simctl io "$SIMULATOR_UDID" screenshot \
            "$RUNNER_TEMP/MemoryHubScreenshots/home-dark.png"

      - name: Upload simulator screenshots
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: memory-hub-simulator-screenshots
          path: ${{ runner.temp }}/MemoryHubScreenshots/*.png
          if-no-files-found: warn
          retention-days: 7
