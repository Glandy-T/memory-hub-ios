name: Android Build

on:
  push:
    branches: [master, main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[lab-only]')
    name: Test and build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub --exclude-tags=visual

      - name: Configure permanent release signing
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/memory-hub-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/memory-hub-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed upgrade pair
        run: |
          BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))
          BASELINE_NUMBER=$((BUILD_NUMBER - 1))
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          flutter build apk --release --no-pub --build-name "$VERSION_NAME" --build-number "$BASELINE_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-baseline.apk
          flutter build apk --release --no-pub --build-name "$VERSION_NAME" --build-number "$BUILD_NUMBER"
          echo "MEMORY_HUB_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "MEMORY_HUB_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "MEMORY_HUB_RELEASE_TAG=android-v$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        working-directory: .

      - name: Install and launch on Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            adb logcat -c
            adb install mobile/build/app/outputs/flutter-apk/app-baseline.apk
            adb install -r mobile/build/app/outputs/flutter-apk/app-release.apk
            adb shell am force-stop com.glandy.memoryhub
            adb shell monkey -p com.glandy.memoryhub -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            # Closing emulator system UI can briefly relaunch the activity while
            # the device finishes its initial configuration. Capture only after
            # the real app shell has had time to replace the bootstrap indicator.
            sleep 5
            adb logcat -d > mobile/build/android-startup-logcat.txt
            adb exec-out screencap -p > mobile/build/android-startup.png
            adb shell pidof com.glandy.memoryhub | grep -q '[0-9]'
            adb shell dumpsys window | grep -q 'mCurrentFocus.*com.glandy.memoryhub'
            ! grep -A 2 'FATAL EXCEPTION' mobile/build/android-startup-logcat.txt | grep -q 'Process: com.glandy.memoryhub'

      - name: Publish latest in-app update
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APK_NAME="memory-hub-android.apk"
          MANIFEST="build/memory-hub-update.json"
          SHA256=$(sha256sum "$APK" | awk '{print toupper($1)}')
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${MEMORY_HUB_RELEASE_TAG}/${APK_NAME}"
          export MANIFEST SHA256 APK_URL
          python -c 'import json,os; from pathlib import Path; Path(os.environ["MANIFEST"]).write_text(json.dumps({"schemaVersion":1,"versionCode":int(os.environ["MEMORY_HUB_BUILD_NUMBER"]),"versionName":os.environ["MEMORY_HUB_VERSION_NAME"],"apkUrl":os.environ["APK_URL"],"sha256":os.environ["SHA256"],"notes":"已通过 Android 35 覆盖安装、启动和致命日志检查。"},ensure_ascii=False,indent=2),encoding="utf-8")'
          cp "$APK" "build/$APK_NAME"
          if gh release view "$MEMORY_HUB_RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$MEMORY_HUB_RELEASE_TAG" "build/$APK_NAME" "$MANIFEST" --clobber
            gh release edit "$MEMORY_HUB_RELEASE_TAG" --latest --title "Memory Hub Android $MEMORY_HUB_VERSION_NAME" --notes "应用内更新通道。已验证可覆盖安装并正常启动。"
          else
            gh release create "$MEMORY_HUB_RELEASE_TAG" "build/$APK_NAME" "$MANIFEST" --latest --title "Memory Hub Android $MEMORY_HUB_VERSION_NAME" --notes "应用内更新通道。已验证可覆盖安装并正常启动。"
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: memory-hub-android-feedback
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android startup evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: memory-hub-android-startup-evidence
          path: |
            mobile/build/android-startup-logcat.txt
            mobile/build/android-startup.png
          if-no-files-found: warn
          retention-days: 7
