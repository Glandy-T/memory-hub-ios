name: MemoryHub
options:
  bundleIdPrefix: com.glandy
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  MemoryHub:
    type: application
    platform: iOS
    sources:
      - path: MemoryHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glandy.memoryhub
        PRODUCT_NAME: Memory Hub
        INFOPLIST_KEY_CFBundleDisplayName: Memory Hub
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
